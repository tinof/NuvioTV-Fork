name: Checks

# Fork-only. Since 2026-10-22 the fork builds no APK or AAR on GitHub: binaries are built locally
# (scripts/shield_build_install.sh, ffmpeg-decoder-downmix/README.md). CI checks the code only and
# uploads nothing but test reports.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, perf/shield-pass]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Empty local properties
        # The tests need no credentials; the build reads these files when they exist.
        run: touch local.properties local.dev.properties

      - name: Run all unit tests
        run: ./gradlew :app:testFullDebugUnitTest --continue --stacktrace

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: app/build/test-results/testFullDebugUnitTest/*.xml
          if-no-files-found: ignore
          retention-days: 7
