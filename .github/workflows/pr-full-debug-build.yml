name: PR Full Debug Build

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [dev]
  workflow_dispatch:
    inputs:
      app_id_suffix:
        description: "Package suffix so the build installs next to the release app (empty = same package)"
        required: false
        default: ".shield"

permissions:
  contents: read

concurrency:
  group: pr-full-debug-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-debug-build:
    name: Build fullDebug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare local properties
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
          LOCAL_DEV_PROPERTIES_BASE64: ${{ secrets.LOCAL_DEV_PROPERTIES_BASE64 }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
          else
            touch local.properties
          fi

          if [ -n "$LOCAL_DEV_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_DEV_PROPERTIES_BASE64" | base64 --decode > local.dev.properties
          else
            touch local.dev.properties
          fi

          # Logs of this public repo are public: mask every value, then list the key names only.
          keys=""
          for file in local.properties local.dev.properties; do
            while IFS='=' read -r key value || [ -n "$key" ]; do
              key="$(printf '%s' "$key" | tr -d '[:space:]')"
              case "$key" in ''|'#'*) continue ;; esac
              value="$(printf '%s' "$value" | tr -d '\r')"
              [ -n "$value" ] && echo "::add-mask::$value"
              [ -n "$value" ] && keys="$keys $key"
            done < "$file"
          done
          echo "Properties with values:${keys:- none}"

          case " $keys " in
            *" NUVIO_SUPABASE_URL "*) ;;
            *)
              message="NUVIO_SUPABASE_URL is not set (secret LOCAL_PROPERTIES_BASE64), so account login will not work in this APK."
              if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
                echo "::error::$message"
                exit 1
              fi
              echo "::warning::$message"
              ;;
          esac

      - name: Prepare CI signing config
        run: |
          keytool -genkeypair \
            -v \
            -keystore "$RUNNER_TEMP/ci-debug.jks" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

          {
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/ci-debug.jks"
            echo "NUVIO_RELEASE_KEY_ALIAS=androiddebugkey"
            echo "NUVIO_RELEASE_KEY_PASSWORD=android"
            echo "NUVIO_RELEASE_STORE_PASSWORD=android"
          } >> "$GITHUB_ENV"

      - name: Install the stable debug key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          # Without the secret, AGP makes a new debug key on every run and builds cannot update each other.
          # app/build.gradle.kts signs debug builds with NUVIO_DEBUG_STORE_FILE when it is set.
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "No DEBUG_KEYSTORE_BASE64 secret; using a throwaway debug key"
            exit 0
          fi
          store="$RUNNER_TEMP/nuvio-debug.keystore"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$store"
          keytool -list -keystore "$store" -storepass android -alias androiddebugkey
          echo "NUVIO_DEBUG_STORE_FILE=$store" >> "$GITHUB_ENV"

      - name: Build fullDebug APK
        env:
          APP_ID_SUFFIX: ${{ inputs.app_id_suffix }}
        run: ./gradlew :app:assembleFullDebug -PnuvioAppIdSuffix="$APP_ID_SUFFIX" --stacktrace

      - name: Show package and signing certificate
        run: |
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          for apk in app/build/outputs/apk/full/debug/*.apk; do
            echo "== $(basename "$apk")"
            "$tools/aapt2" dump badging "$apk" | grep -m 1 '^package:'
            "$tools/apksigner" verify --print-certs "$apk" | grep -m 1 'SHA-256 digest'
          done

      - name: Upload fullDebug APK
        uses: actions/upload-artifact@v7
        with:
          name: full-debug-apks
          path: app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Run all unit tests
        env:
          APP_ID_SUFFIX: ${{ inputs.app_id_suffix }}
        run: ./gradlew :app:testFullDebugUnitTest -PnuvioAppIdSuffix="$APP_ID_SUFFIX" --continue --stacktrace

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: app/build/test-results/testFullDebugUnitTest/*.xml
          if-no-files-found: ignore
          retention-days: 7
