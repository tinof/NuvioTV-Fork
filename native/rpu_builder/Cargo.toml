[package]
name = "nuvio_rpu"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
license = "GPL-3.0-only"
description = "JNI wrapper over hdr-analyze's dovi_rpu_builder: Dolby Vision 8.1 / 8.4 RPUs for NuvioTV's conversion (ROADMAP DV2.2)"
publish = false

[lib]
name = "nuvio_rpu"
# cdylib only: an rlib in this list turns LTO off for the cdylib. Its own shared library, not
# linked into libdovi_bridge.so (docs/dv-conversion/DESIGN.md 2.7).
crate-type = ["cdylib"]

[dependencies]
# Pinned to an hdr-analyze commit on main; moving it is described in README.md. The rev's first
# seven characters are also in the version string (src/api.rs, VERSION), which a test checks.
dovi_rpu_builder = { git = "https://github.com/tinof/hdr-analyze", rev = "eb727a02c33f6ca251d460e9aec1ddaf52ab344d" }
jni = { version = "0.21", default-features = false }

[features]
# Test only, never for the Android build: `cargo test --features jvm-tests` also runs src/jvm_tests.rs,
# which calls the Java_* exports through a JVM that jni's invocation API starts from $JAVA_HOME
# (README.md, Build and test).
jvm-tests = ["jni/invocation"]

[dev-dependencies]
# Reads the fixtures' JSON; the version dovi_rpu_builder already pulls in.
serde_json = "1.0"
# The HLG composer's luminance-mapping name for the test manifest (src/manifest.rs); same commit
# as dovi_rpu_builder, so Cargo resolves the one copy dovi_rpu_builder already uses.
dovi84_composer = { git = "https://github.com/tinof/hdr-analyze", rev = "eb727a02c33f6ca251d460e9aec1ddaf52ab344d" }

[profile.release]
# Every JNI entry point runs inside catch_unwind, which needs unwinding.
panic = "unwind"
lto = "fat"
codegen-units = 1
strip = true
